---
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        protocol: TCP
    # AEP-87 two-provider e2e: local-path PV data must resolve to the SAME
    # absolute path on the host and inside the node, so the in-process
    # replication file driver can read source PVs and land imports in
    # destination PVs. setup-kind.sh repoints the local-path provisioner
    # at this directory.
    extraMounts:
      - hostPath: /tmp/akash-e2e-storage
        containerPath: /tmp/akash-e2e-storage

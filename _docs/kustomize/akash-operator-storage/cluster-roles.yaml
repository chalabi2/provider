---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: akash-operator-storage
  labels:
    app.kubernetes.io/name: storage
    app.kubernetes.io/instance: storage-service
    app.kubernetes.io/component: operator
    app.kubernetes.io/part-of: provider
rules:
  # the PV claimRef choreography: provision, attach, detach, GC
  - apiGroups:
      - ''
    resources:
      - persistentvolumes
    verbs:
      - get
      - list
      - watch
      - update
      - patch
      - delete
  - apiGroups:
      - ''
    resources:
      - persistentvolumeclaims
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ''
    resources:
      - namespaces
      - services
    verbs:
      - get
      - list
      - watch
  # rook-ceph-tools exec for the rbd stream-export driver
  - apiGroups:
      - ''
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ''
    resources:
      - pods/exec
    verbs:
      - create
      - get
  # the Volume CRDs the operator reconciles
  - apiGroups:
      - akash.network
    resources:
      - volumes
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # CSI snapshots backing snapshot-based exports
  - apiGroups:
      - snapshot.storage.k8s.io
    resources:
      - volumesnapshots
      - volumesnapshotcontents
    verbs:
      - get
      - list
      - watch
      - create
      - delete
  - apiGroups:
      - storage.k8s.io
    resources:
      - storageclasses
    verbs:
      - get
      - list
      - watch

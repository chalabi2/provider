---
apiVersion: v1
kind: Service
metadata:
  # the daemon's storage operator client discovers this service by name
  # ("operator-storage", port "rest") in akash-services.
  name: operator-storage
  labels:
    app.kubernetes.io/name: storage
    app.kubernetes.io/instance: storage-service
    app.kubernetes.io/component: operator
    app.kubernetes.io/part-of: provider
spec:
  selector:
    app.kubernetes.io/name: storage
    app.kubernetes.io/instance: storage-service
    app.kubernetes.io/component: operator
    app.kubernetes.io/part-of: provider
  ports:
    - name: rest
      port: 8080

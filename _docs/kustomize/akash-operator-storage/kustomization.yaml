---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: akash-services
resources:
  - deployment.yaml
  - service.yaml
  - role-bindings.yaml
  - service-accounts.yaml
  - cluster-roles.yaml
configMapGenerator:
  - name: operator-storage
    literals:
      - k8s-manifest-ns=lease
      - volumes-namespace=akash-volumes
      - resync-interval=5m
      - prune-interval=600s
      - web-refresh-interval=5s
      - retry-delay=3s
generatorOptions:
  disableNameSuffixHash: true

---
version: "2.2"

volumes:
  myapp-pgdata:
    external:
      owner: akash1365yvmc4s7awdyj3n2sav7xfx76adc6dnmlx63
      dseq: 1234567

services:
  db:
    image: postgres:16
    expose:
      - port: 5432
        to:
          - global: true
    params:
      storage:
        data:
          mount: /var/lib/postgresql/data
          volume: myapp-pgdata

profiles:
  compute:
    db:
      resources:
        cpu:
          units: 2
        memory:
          size: 4Gi
        storage: []
  placement:
    anywhere:
      pricing:
        db:
          denom: uakt
          amount: 800

deployment:
  db:
    anywhere:
      profile: db
      count: 1
